<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IITM Observation Portal</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand-mark" aria-hidden="true">
            <img src="logo.gif" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span>I</span>
        </div>
        <div class="header-text">
            <h1>IITM Observational Facilities Portal</h1>
            <p>Interactive Map of IITM Observation Instruments</p>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <button id="sidebarToggle"
                    class="sidebar-toggle"
                    type="button"
                    aria-label="Hide sidebar"
                    aria-expanded="true">
                <span aria-hidden="true">‹</span>
            </button>

            <div class="sidebar-head">
                <h2>Instrument List</h2>
                <span id="resultCount" class="result-count">0</span>
            </div>

            <!-- Search -->
            <input type="text"
                   id="searchInput"
                   placeholder="🔍 Search instrument...">

            <!-- Filter Button -->
            <button id="filterBtn" class="filter-btn">
                ⚙ Filters
            </button>

            <!-- Filter Panel -->
            <div id="filterPanel" class="filter-panel">

                <label>Instrument</label>
                <select id="instrumentFilter">
                    <option value="">All Instruments</option>
                </select>

                <label>Location</label>
                <select id="locationFilter">
                    <option value="">All Locations</option>
                </select>

                <label>Category</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
<!-- 
                <label>Date</label>
                <input type="date" id="dateFilter"> -->

                <button id="resetFilters" class="reset-btn">
                    Reset Filters
                </button>

            </div>

            <!-- Instrument List -->
            <div id="instrumentList" class="instrument-list"></div>

        </aside>

        <!-- Map Area -->
        <main class="map-container">
            <div id="map"></div>
        </main>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <!-- JS File -->
    <script src="script.js"></script>

</body>
</html>
